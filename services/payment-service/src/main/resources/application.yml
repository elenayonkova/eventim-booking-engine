server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventim?currentSchema=payment}
    username: ${SPRING_DATASOURCE_USERNAME:eventim}
    password: ${SPRING_DATASOURCE_PASSWORD:eventim}
  flyway:
    schemas: payment
    default-schema: payment
    create-schemas: true

payment:
  recovery-sweep-ms: ${PAYMENT_RECOVERY_SWEEP_MS:30000}
  provider-attempt-timeout: ${PAYMENT_PROVIDER_ATTEMPT_TIMEOUT:90s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
