server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventim?currentSchema=booking}
    username: ${SPRING_DATASOURCE_USERNAME:eventim}
    password: ${SPRING_DATASOURCE_PASSWORD:eventim}
  flyway:
    schemas: booking
    default-schema: booking
    create-schemas: true

booking:
  hold-ttl: ${BOOKING_HOLD_TTL:5m}
  expiry-sweep-ms: ${BOOKING_EXPIRY_SWEEP_MS:30000}
  payment-base-url: ${PAYMENT_BASE_URL:http://localhost:8081}
  payment-connect-timeout: ${PAYMENT_CONNECT_TIMEOUT:2s}
  payment-read-timeout: ${PAYMENT_READ_TIMEOUT:65s}
  payment-missing-timeout: ${PAYMENT_MISSING_TIMEOUT:90s}
  payment-reconciliation-sweep-ms: ${PAYMENT_RECONCILIATION_SWEEP_MS:30000}
  refund-reconciliation-sweep-ms: ${REFUND_RECONCILIATION_SWEEP_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
