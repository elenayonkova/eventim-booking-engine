services:
  postgres:
    image: postgres:17-alpine
    container_name: eventim-postgres
    environment:
      POSTGRES_DB: eventim
      POSTGRES_USER: eventim
      POSTGRES_PASSWORD: eventim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventim -d eventim"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: eventim/payment-service:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventim?currentSchema=payment
      SPRING_DATASOURCE_USERNAME: eventim
      SPRING_DATASOURCE_PASSWORD: eventim
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    image: eventim/booking-service:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventim?currentSchema=booking
      SPRING_DATASOURCE_USERNAME: eventim
      SPRING_DATASOURCE_PASSWORD: eventim
      PAYMENT_BASE_URL: http://payment-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
